<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveen · 3D Portrait</title>
<meta name="description" content="Naveen (smnaveen96) — an interactive 3D ASCII portrait. Drag to rotate.">
<style>
  :root {
    --bg: #0a0e14;
    --win: #0d1117;
    --win2: #111722;
    --frame: #30363d;
    --muted: #7d8590;
    --ink: #c9d1d9;
    --green: #39d353;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .win {
    width: 100%; max-width: 760px;
    background: linear-gradient(var(--win2), var(--win));
    border: 1px solid var(--frame); border-radius: 12px;
    overflow: hidden;
  }
  .bar {
    position: relative; height: 30px; border-bottom: 1px solid var(--frame);
    display: flex; align-items: center; padding: 0 14px; gap: 6px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .bar .title {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; pointer-events: none;
    white-space: nowrap; overflow: hidden; padding: 0 70px;
  }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; touch-action: none;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
    color: var(--muted); font-size: 12px; pointer-events: none;
    transition: opacity .6s;
  }
  .status {
    border-top: 1px solid var(--frame); padding: 7px 14px 8px;
    display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between;
    color: var(--muted);
  }
  .status b { color: var(--ink); font-weight: 400; }
  .status a { color: var(--muted); text-decoration: none; }
  .status a:hover { color: var(--green); }
  .cursor {
    display: inline-block; width: .6em; height: 1.05em; background: var(--ink);
    vertical-align: -0.18em; margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<main class="win">
  <div class="bar">
    <span class="dot" style="background:#ff5f56"></span>
    <span class="dot" style="background:#ffbd2e"></span>
    <span class="dot" style="background:#27c93f"></span>
    <span class="title">smnaveen96@github: ~$ ./portrait.sh --3d</span>
  </div>
  <div class="stage">
    <canvas id="c" aria-label="Interactive 3D ASCII portrait of Naveen. Drag to rotate."></canvas>
    <div class="hint" id="hint">drag to rotate</div>
  </div>
  <div class="status">
    <span>smnaveen96@github:~$ whoami <b>Naveen</b><span class="cursor"></span></span>
    <span>
      <a href="https://github.com/smnaveen96">github</a> ·
      <a href="https://smnaveen.in">smnaveen.in</a> ·
      <a href="https://www.instagram.com/smnaveen96">instagram</a> ·
      <a href="https://www.linkedin.com/in/smnaveen96/">linkedin</a>
    </span>
  </div>
</main>

<script>
(async function () {
  const RAMP = " .`:-=+*cs#%@";          // sparse -> dense, same as the README portrait
  const WHITE_FLOOR = 0.92, GAMMA = 0.95;
  const MAX_YAW = 0.9, MAX_PITCH = 0.45;  // radians -- past this the inflated depth shows its seams
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");

  // ---- data: gray / depth / mask, each size x size bytes ----
  const data = await (await fetch("portrait.json")).json();
  const N = data.size;
  const bytes = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
  const gray = bytes(data.gray), depth = bytes(data.depth), mask = bytes(data.mask);

  // points with a surface normal from the depth gradient (for lighting as it turns)
  const pts = [];
  const zAt = (x, y) => depth[Math.min(N - 1, Math.max(0, y)) * N + Math.min(N - 1, Math.max(0, x))] / 255;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (mask[i] < 128) continue;
    const z = (depth[i] / 255 - 0.5) * data.relief;
    const dzx = (zAt(x + 1, y) - zAt(x - 1, y)) * data.relief * N / 2;
    const dzy = (zAt(x, y + 1) - zAt(x, y - 1)) * data.relief * N / 2;
    const len = Math.hypot(dzx, dzy, 1);
    pts.push(x / N - 0.5, y / N - 0.5, z, gray[i] / 255, -dzx / len, -dzy / len, 1 / len);
  }
  const P = new Float32Array(pts);
  const COUNT = P.length / 7;

  // ---- layout ----
  let cols, rows, cellW, cellH, dpr, zbuf, lum;
  function layout() {
    const w = canvas.clientWidth;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cols = Math.max(70, Math.min(150, Math.floor(w / 5)));
    cellW = w / cols;
    cellH = cellW * 15 / 8;                    // same 8:15 cell as the svg
    rows = Math.round(cols * 8 / 15);
    canvas.style.height = rows * cellH + "px";
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(rows * cellH * dpr);
    zbuf = new Float32Array(cols * rows);
    lum = new Float32Array(cols * rows);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${(cellH * 0.86).toFixed(2)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textBaseline = "alphabetic";
  }
  layout();
  new ResizeObserver(layout).observe(canvas);

  // ---- interaction: drag to rotate, pointer to look, idle sway ----
  let yaw = 0, pitch = 0;              // current
  let lookYaw = 0, lookPitch = 0;      // from pointer position
  let dragYaw = 0, dragPitch = 0;      // from dragging
  let dragging = false, lastX = 0, lastY = 0, lastInput = -1e9, interacted = false;

  window.addEventListener("pointermove", (e) => {
    lookYaw = (e.clientX / innerWidth - 0.5) * 0.5;
    lookPitch = (e.clientY / innerHeight - 0.5) * -0.3;
    lastInput = performance.now();
    if (!dragging) return;
    dragYaw = Math.max(-MAX_YAW, Math.min(MAX_YAW, dragYaw + (e.clientX - lastX) * 0.008));
    dragPitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, dragPitch - (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging");
    if (!interacted) { interacted = true; hint.style.opacity = 0; }
  });
  const release = () => { dragging = false; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  // ---- render ----
  const LX = -0.45, LY = -0.5, LZ = 0.74;      // light: front, upper-left, fixed in view space
  const start = performance.now();
  function frame(now) {
    const t = (now - start) / 1000;
    if (!dragging) { dragYaw *= 0.94; dragPitch *= 0.94; }   // ease back to centre
    const idle = !reduce && now - lastInput > 2500 ? Math.sin(t * 0.7) * 0.22 : 0;
    const look = now - lastInput > 2500 ? 0 : 1;
    const ty = dragYaw + lookYaw * look + idle;
    const tp = dragPitch + lookPitch * look;
    yaw += (ty - yaw) * 0.12; pitch += (tp - pitch) * 0.12;

    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const F = 2.4;                                    // perspective focal length
    zbuf.fill(-1e9); lum.fill(1);
    for (let i = 0; i < COUNT; i++) {
      const o = i * 7;
      const x = P[o], y = P[o + 1], z = P[o + 2];
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      const s = F / (F - z2);
      const c = ((x1 * s + 0.5) * cols) | 0, r = ((y2 * s + 0.5) * rows) | 0;
      if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
      const k = r * cols + c;
      if (z2 <= zbuf[k]) continue;
      zbuf[k] = z2;
      // rotate the normal the same way, then light it
      const nx = P[o + 4], ny = P[o + 5], nz = P[o + 6];
      const nx1 = nx * cy + nz * sy, nz1 = -nx * sy + nz * cy;
      const ny2 = ny * cp - nz1 * sp, nz2 = ny * sp + nz1 * cp;
      const lam = Math.max(0, nx1 * LX + ny2 * LY + nz2 * LZ);
      lum[k] = 1 - (1 - P[o + 3]) * (0.55 + 0.45 * lam);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#c9d1d9";
    const shown = reduce ? rows : Math.min(rows, Math.floor(t / 1.4 * rows));   // print-in on load
    for (let r = 0; r < shown; r++) {
      let line = "";
      for (let c = 0; c < cols; c++) {
        const v = Math.pow(lum[r * cols + c], GAMMA);
        line += v >= WHITE_FLOOR ? " " : RAMP[Math.min(RAMP.length - 1, ((1 - v) * (RAMP.length - 1) + 0.5) | 0)];
      }
      ctx.fillText(line, 0, r * cellH + cellH * 0.74, cols * cellW);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
